<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOM CAFÉ — Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Montserrat', system-ui, sans-serif; }
        .bloom-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #d48fcf;
        }
        .bloom-logo-img {
            width: 3.25rem;
            height: 3.25rem;
            margin: 0 auto 1rem;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* Kitchen display — large type for fast reading at a distance */
        .kitchen-col-title { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.02em; }
        .kitchen-col-count { font-size: 0.95rem; font-weight: 800; padding: 0.2rem 0.65rem; border-radius: 9999px; }
        .kitchen-order-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 1rem;
            padding: 1rem 1.1rem;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }
        .kitchen-order-card--pending { border-left: 5px solid #fbbf24; }
        .kitchen-order-card--preparing { border-left: 5px solid #60a5fa; }
        .kitchen-order-card--served { border-left: 5px solid #34d399; opacity: 0.92; }
        .kitchen-order-meta { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
        .kitchen-table-badge {
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 0.75rem;
            padding: 0.65rem 0.75rem;
            text-align: center;
        }
        .kitchen-table-label {
            font-size: clamp(1.75rem, 4vw, 2.35rem);
            font-weight: 900;
            line-height: 1.1;
            color: #fff;
            letter-spacing: 0.02em;
        }
        .kitchen-item-row {
            border-bottom: 1px solid rgba(148,163,184,0.2);
            padding: 0.55rem 0;
        }
        .kitchen-item-row:last-child { border-bottom: none; }
        .kitchen-item-qty {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.5rem;
            font-size: 1.75rem;
            font-weight: 900;
            color: #fbbf24;
            margin-right: 0.5rem;
        }
        .kitchen-item-name {
            font-size: clamp(1.25rem, 2.8vw, 1.6rem);
            font-weight: 800;
            color: #f8fafc;
            line-height: 1.25;
        }
        .kitchen-modifier {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fbbf24;
            padding-left: 3rem;
            margin-top: 0.25rem;
        }
        .kitchen-note {
            margin-top: 0.45rem;
            font-size: 1.05rem;
            font-weight: 800;
            color: #fde68a;
            background: rgba(245,158,11,0.15);
            border: 2px solid rgba(245,158,11,0.35);
            border-radius: 0.5rem;
            padding: 0.45rem 0.65rem;
        }
        .kitchen-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.75rem; }
        .kitchen-btn {
            border-radius: 0.65rem;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 0.7rem 0.5rem;
            transition: background 0.15s;
        }
        .kitchen-btn-primary { background: #2563eb; color: #fff; }
        .kitchen-btn-primary:hover { background: #1d4ed8; }
        .kitchen-btn-ready { background: #059669; color: #fff; }
        .kitchen-btn-ready:hover { background: #047857; }
        .kitchen-btn-cancel { background: rgba(225,29,72,0.2); color: #fda4af; border: 1px solid rgba(225,29,72,0.35); }
        .kitchen-btn-cancel:hover { background: rgba(225,29,72,0.35); }
        .kitchen-ready-badge {
            text-align: center;
            font-size: 1rem;
            font-weight: 800;
            color: #34d399;
            background: rgba(52,211,153,0.12);
            border: 2px solid rgba(52,211,153,0.3);
            border-radius: 0.65rem;
            padding: 0.65rem;
        }
        .kitchen-orders-list { display: flex; flex-direction: column; gap: 1rem; max-height: 78vh; overflow-y: auto; padding-right: 0.25rem; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Staff Login Gate -->
    <div id="login-gate" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-6">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
            <img src="/static/bloom-logo.png" alt="" class="bloom-logo-img" aria-hidden="true" />
            <h1 class="text-2xl bloom-brand mb-1 text-center" id="login-title">BLOOM CAFÉ</h1>
            <p class="text-xs text-slate-400 mb-6 text-center" id="login-subtitle">Kitchen — enter staff PIN to view and manage orders.</p>
            <input type="password" id="kitchen-pin-input" placeholder="Kitchen PIN"
                class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-sm mb-4 outline-none focus:border-emerald-500">
            <button onclick="loginKitchen()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-lg font-bold text-sm transition">
                Unlock Kitchen Panel
            </button>
            <p id="login-error" class="text-rose-400 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div>
            <h1 id="station-title" class="text-2xl bloom-brand">BLOOM CAFÉ Kitchen</h1>
            <p id="station-subtitle" class="text-xs text-slate-400">Paid and validated orders monitor</p>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="logoutKitchen()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">Logout</button>
            <span id="audio-status-banner" class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-lg">
                🔔 Click anywhere to enable alert sounds
            </span>
            <div class="flex items-center gap-2">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse" id="ws-indicator"></span>
                <span class="text-xs text-slate-400 font-medium" id="ws-status">Connecting...</span>
            </div>
        </div>
    </header>

    <section id="alerts-container" class="max-w-7xl mx-auto px-6 mt-4 space-y-2"></section>
    <div id="new-order-flash" class="fixed inset-0 pointer-events-none z-40 hidden bg-amber-400/30"></div>

    <main class="p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="bg-slate-800/50 rounded-2xl p-4 border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="kitchen-col-title text-amber-400 flex items-center gap-2">
                    Pending <span class="kitchen-col-count bg-amber-400/20 text-amber-300" id="count-pending">0</span>
                </h2>
            </div>
            <div id="pending-orders" class="kitchen-orders-list"></div>
        </div>

        <div class="bg-slate-800/50 rounded-2xl p-4 border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="kitchen-col-title text-blue-400 flex items-center gap-2">
                    Preparing <span class="kitchen-col-count bg-blue-400/20 text-blue-300" id="count-preparing">0</span>
                </h2>
            </div>
            <div id="preparing-orders" class="kitchen-orders-list"></div>
        </div>

        <div class="bg-slate-800/50 rounded-2xl p-4 border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="kitchen-col-title text-emerald-400 flex items-center gap-2">
                    Served / Ready <span class="kitchen-col-count bg-emerald-400/20 text-emerald-300" id="count-served">0</span>
                </h2>
            </div>
            <div id="served-orders" class="kitchen-orders-list"></div>
        </div>
    </main>

    <script>
        const API_BASE = `${window.location.origin}/api/v1`;
        const pathMatch = window.location.pathname.match(/\/kitchen\/(coffee|food)\/?$/);
        const KITCHEN_STATION = pathMatch ? pathMatch[1] : null;
        const STATION_CONFIG = {
            coffee: {
                title: 'Coffee Bar Display',
                subtitle: 'Drinks and coffee orders',
                accent: 'amber',
                emoji: '☕',
                readyLabel: '✓ Drinks Ready for Pickup',
                startLabel: 'Start Preparing',
            },
            food: {
                title: 'Food Kitchen Display',
                subtitle: 'Food orders monitor',
                accent: 'emerald',
                emoji: '🍳',
                readyLabel: '✓ Food Delivered to Table',
                startLabel: 'Start Cooking',
            },
        };
        let coffeeCategories = new Set();
        let kitchenToken = sessionStorage.getItem('kitchen_token');
        let audioCtx = null;
        let audioUnlocked = sessionStorage.getItem('kitchen_audio_unlocked') === '1';
        const ALERT_GAIN = 4.8;
        let masterGain = null;

        function getMasterGain(ctx) {
            if (!masterGain || masterGain.context !== ctx) {
                masterGain = ctx.createGain();
                masterGain.gain.value = ALERT_GAIN;
                masterGain.connect(ctx.destination);
            }
            return masterGain;
        }

        function getStationConfig() {
            if (KITCHEN_STATION && STATION_CONFIG[KITCHEN_STATION]) {
                return STATION_CONFIG[KITCHEN_STATION];
            }
            return STATION_CONFIG.food;
        }

        function applyStationBranding() {
            const config = getStationConfig();
            const titleEl = document.getElementById('station-title');
            const subtitleEl = document.getElementById('station-subtitle');
            if (titleEl) {
                titleEl.textContent = `${config.emoji} ${config.title}`;
                titleEl.className = `text-2xl font-black text-${config.accent}-400`;
            }
            if (subtitleEl) {
                subtitleEl.textContent = config.subtitle;
            }
            const loginTitle = document.getElementById('login-title');
            const loginSubtitle = document.getElementById('login-subtitle');
            if (loginTitle && KITCHEN_STATION) {
                loginTitle.textContent = `${config.emoji} ${config.title}`;
                loginTitle.className = `text-2xl font-black text-${config.accent}-400 mb-2`;
            }
            if (loginSubtitle && KITCHEN_STATION) {
                loginSubtitle.textContent = `Enter staff PIN to open the ${config.title.toLowerCase()}.`;
            }
            document.title = config.title;
        }

        function itemStation(menuItem) {
            if (menuItem && menuItem.kitchen_station) {
                return menuItem.kitchen_station;
            }
            const category = menuItem ? menuItem.category : '';
            const name = (category || '').trim().toLowerCase();
            return coffeeCategories.has(name) ? 'coffee' : 'food';
        }

        function orderMatchesStation(order) {
            if (!KITCHEN_STATION) return true;
            return (order.items || []).some((item) => {
                return itemStation(item.menu_item) === KITCHEN_STATION;
            });
        }

        async function loadStationConfig() {
            try {
                const response = await fetch(`${API_BASE}/kitchen/stations/config`);
                if (!response.ok) return;
                const data = await response.json();
                coffeeCategories = new Set((data.coffee_categories || []).map((c) => c.toLowerCase()));
            } catch (err) {
                console.warn('Could not load kitchen station config', err);
            }
        }

        function getOrdersEndpoint() {
            if (KITCHEN_STATION) {
                return `${API_BASE}/kitchen/${KITCHEN_STATION}/orders`;
            }
            return `${API_BASE}/kitchen/food/orders`;
        }

        async function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            return audioCtx;
        }

        function warmKitchenAudio() {
            if (!audioUnlocked) return;
            ensureAudioContext().catch((err) => console.warn('Audio warm-up failed', err));
        }

        function playKitchenAlertSoundNow(ctx, pattern = 'order') {
            const t = ctx.currentTime;
            if (pattern === 'service') {
                playCafeChime(ctx, 587, t, 0.45, 0.9);
                playCafeChime(ctx, 784, t + 0.28, 0.5, 0.95);
                return;
            }

            // Warm café chime — G major arpeggio ×2, ~3.5s, loud but gentle
            const phrase = [
                { freq: 392, at: 0, dur: 0.55, peak: 1.0 },
                { freq: 494, at: 0.32, dur: 0.55, peak: 0.95 },
                { freq: 587, at: 0.64, dur: 0.55, peak: 0.95 },
                { freq: 784, at: 0.96, dur: 0.85, peak: 1.0 },
            ];
            const repeatAt = 1.95;
            phrase.forEach((note) => {
                playCafeChime(ctx, note.freq, t + note.at, note.dur, note.peak);
                playCafeChime(ctx, note.freq, t + repeatAt + note.at, note.dur, note.peak * 0.92);
            });
        }

        function playKitchenAlertSound(pattern = 'order') {
            if (!audioUnlocked) return;

            try {
                if (audioCtx && audioCtx.state === 'running') {
                    playKitchenAlertSoundNow(audioCtx, pattern);
                    return;
                }
                ensureAudioContext().then((ctx) => {
                    if (ctx.state === 'running') {
                        playKitchenAlertSoundNow(ctx, pattern);
                    }
                });
            } catch (e) {
                console.error('Kitchen alert sound failed', e);
            }
        }

        function markAudioActive() {
            audioUnlocked = true;
            sessionStorage.setItem('kitchen_audio_unlocked', '1');
            const banner = document.getElementById('audio-status-banner');
            if (banner) {
                banner.innerText = "🔊 Audio Active";
                banner.className = "text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg";
            }
        }

        async function unlockKitchenAlerts() {
            await ensureAudioContext();
            markAudioActive();
            warmKitchenAudio();
            if ('Notification' in window && Notification.permission === 'default') {
                try {
                    await Notification.requestPermission();
                } catch (err) {
                    console.warn('Notification permission request failed', err);
                }
            }
        }

        function showBackgroundNotification(title, body) {
            if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') {
                return;
            }
            try {
                new Notification(title, { body, tag: 'kitchen-alert' });
            } catch (err) {
                console.warn('Background notification failed', err);
            }
        }

        function getAuthHeaders() {
            return {
                'Authorization': `Bearer ${kitchenToken}`,
                'Content-Type': 'application/json'
            };
        }

        function showLoginGate(show) {
            document.getElementById('login-gate').classList.toggle('hidden', !show);
        }

        async function loginKitchen() {
            const pin = document.getElementById('kitchen-pin-input').value;
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/kitchen/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                if (!response.ok) {
                    errorEl.innerText = 'Invalid PIN. Please try again.';
                    errorEl.classList.remove('hidden');
                    return;
                }
                const data = await response.json();
                kitchenToken = data.token;
                sessionStorage.setItem('kitchen_token', kitchenToken);
                showLoginGate(false);
                await unlockKitchenAlerts();
                fetchOrders();
                connectWS();
            } catch (err) {
                errorEl.innerText = 'Connection failed. Please retry.';
                errorEl.classList.remove('hidden');
            }
        }

        async function logoutKitchen() {
            try {
                await fetch(`${API_BASE}/kitchen/logout`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });
            } catch (err) { /* ignore */ }
            sessionStorage.removeItem('kitchen_token');
            kitchenToken = null;
            location.reload();
        }

        document.getElementById('kitchen-pin-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginKitchen();
        });

        document.body.addEventListener('pointerdown', () => {
            unlockKitchenAlerts();
        }, { passive: true });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                warmKitchenAudio();
            }
        });

        function playCafeChime(ctx, frequency, startTime, duration, peak = 1.0) {
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(frequency, startTime);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(peak, startTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(peak * 0.85, startTime + duration * 0.45);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            oscillator.connect(gain);
            gain.connect(getMasterGain(ctx));
            oscillator.start(startTime);
            oscillator.stop(startTime + duration + 0.05);

            const shimmer = ctx.createOscillator();
            const shimmerGain = ctx.createGain();
            shimmer.type = 'sine';
            shimmer.frequency.setValueAtTime(frequency * 2, startTime);
            shimmerGain.gain.setValueAtTime(0.0001, startTime);
            shimmerGain.gain.exponentialRampToValueAtTime(peak * 0.2, startTime + 0.02);
            shimmerGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration * 0.55);
            shimmer.connect(shimmerGain);
            shimmerGain.connect(getMasterGain(ctx));
            shimmer.start(startTime);
            shimmer.stop(startTime + duration * 0.6);
        }

        function flashNewOrderScreen() {
            const flash = document.getElementById('new-order-flash');
            if (!flash) return;
            flash.classList.remove('hidden');
            setTimeout(() => flash.classList.add('hidden'), 900);
        }

        function vibrateNewOrderAlert() {
            if (navigator.vibrate) {
                navigator.vibrate([400, 120, 400, 120, 400, 120, 600]);
            }
        }

        function showNewOrderBanner(tableNumber) {
            const container = document.getElementById('alerts-container');
            const alertBox = document.createElement('div');
            alertBox.className = "bg-amber-500 text-slate-900 font-black p-4 rounded-xl flex justify-between items-center shadow-lg animate-bounce border-2 border-amber-300";
            alertBox.innerHTML = `
                <span>${getStationConfig().emoji} NEW ORDER${tableNumber ? ` - Table ${tableNumber}` : ''}!</span>
                <button onclick="this.parentElement.remove()" class="bg-slate-900/20 hover:bg-slate-900/30 text-slate-900 font-black px-3 py-1 rounded-lg text-xs">Dismiss</button>
            `;
            container.prepend(alertBox);
            setTimeout(() => alertBox.remove(), 12000);
        }

        function playNewOrderChime(tableNumber) {
            playKitchenAlertSound('order');

            vibrateNewOrderAlert();
            flashNewOrderScreen();
            showNewOrderBanner(tableNumber);
            showBackgroundNotification(
                'New Kitchen Order',
                tableNumber ? `Table ${tableNumber} placed a new order.` : 'A new order just arrived.'
            );
        }

        async function fetchOrders() {
            if (!kitchenToken) return;
            try {
                const response = await fetch(getOrdersEndpoint(), {
                    headers: getAuthHeaders()
                });
                if (response.status === 401) {
                    logoutKitchen();
                    return;
                }
                const orders = await response.json();
                renderOrders(orders);
            } catch (err) {
                console.error("Failed to query records.");
            }
        }

        function cancelButton(orderId) {
            return `<button onclick="cancelOrder(${orderId})" class="kitchen-btn kitchen-btn-cancel">Cancel</button>`;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderOrders(orders) {
            const pendingDiv = document.getElementById("pending-orders");
            const preparingDiv = document.getElementById("preparing-orders");
            const servedDiv = document.getElementById("served-orders");

            pendingDiv.innerHTML = "";
            preparingDiv.innerHTML = "";
            servedDiv.innerHTML = "";

            let pendingCount = 0, preparingCount = 0, servedCount = 0;

            orders.forEach(order => {
                const card = document.createElement("div");
                const status = (order.status || "").toLowerCase();
                const config = getStationConfig();
                const statusClass = status === 'pending' ? 'kitchen-order-card--pending'
                    : status === 'preparing' ? 'kitchen-order-card--preparing'
                    : 'kitchen-order-card--served';
                card.className = `kitchen-order-card ${statusClass}`;

                const itemsHtml = (order.items || []).map(i => {
                    const modsSubtext = (i.selected_modifiers || []).map(m => `
                        <div class="kitchen-modifier">+ ${escapeHtml(m.modifier.name)}</div>
                    `).join("");

                    return `
                        <div class="kitchen-item-row">
                            <div class="flex items-start">
                                <span class="kitchen-item-qty">${i.quantity}×</span>
                                <span class="kitchen-item-name">${escapeHtml(i.menu_item.name)}</span>
                            </div>
                            ${i.notes ? `<div class="kitchen-note">📝 ${escapeHtml(i.notes)}</div>` : ''}
                            ${modsSubtext}
                        </div>
                    `;
                }).join("");

                let actionsHtml = "";
                if (status === "pending") {
                    actionsHtml = `
                        <div class="kitchen-actions">
                            <button onclick="updateStatus(${order.id}, 'preparing')" class="kitchen-btn kitchen-btn-primary">${config.startLabel}</button>
                            ${cancelButton(order.id)}
                        </div>
                    `;
                    pendingCount++;
                    card.innerHTML = createCardTemplate(order, itemsHtml, actionsHtml);
                    pendingDiv.appendChild(card);
                } else if (status === "preparing") {
                    actionsHtml = `
                        <div class="kitchen-actions">
                            <button onclick="updateStatus(${order.id}, 'served')" class="kitchen-btn kitchen-btn-ready">Mark Ready</button>
                            ${cancelButton(order.id)}
                        </div>
                    `;
                    preparingCount++;
                    card.innerHTML = createCardTemplate(order, itemsHtml, actionsHtml);
                    preparingDiv.appendChild(card);
                } else if (status === "served") {
                    actionsHtml = `<div class="kitchen-ready-badge">${config.readyLabel}</div>`;
                    servedCount++;
                    card.innerHTML = createCardTemplate(order, itemsHtml, actionsHtml);
                    servedDiv.appendChild(card);
                }
            });

            document.getElementById("count-pending").innerText = pendingCount;
            document.getElementById("count-preparing").innerText = preparingCount;
            document.getElementById("count-served").innerText = servedCount;
        }

        function createCardTemplate(order, itemsHtml, actionsHtml) {
            const timeStr = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const tableLabel = order.table && order.table.label === 'Counter'
                ? 'Counter'
                : `Table ${escapeHtml(order.table.label)}`;
            return `
                <div class="flex justify-between items-center mb-2">
                    <span class="kitchen-order-meta">#${order.id}</span>
                    <span class="kitchen-order-meta">${timeStr}</span>
                </div>
                <div class="kitchen-table-badge mb-3">
                    <h3 class="kitchen-table-label">${tableLabel}</h3>
                </div>
                <div class="my-1">
                    ${itemsHtml}
                </div>
                ${actionsHtml}
            `;
        }

        async function updateStatus(orderId, nextStatus) {
            try {
                await fetch(`${API_BASE}/kitchen/orders/${orderId}/status?status=${nextStatus}`, {
                    method: 'PATCH',
                    headers: getAuthHeaders()
                });
                fetchOrders();
            } catch (err) {
                console.error("Failed to alter status.");
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('Cancel this order? Stock will be restored.')) return;
            try {
                const response = await fetch(`${API_BASE}/kitchen/orders/${orderId}/cancel`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                if (response.ok) {
                    fetchOrders();
                } else {
                    const err = await response.json();
                    alert(err.detail || 'Could not cancel order.');
                }
            } catch (err) {
                console.error("Failed to cancel order.");
            }
        }

        function triggerStaffSummonAlert(tableNum, serviceRequest) {
            playKitchenAlertSound('service');

            const container = document.getElementById('alerts-container');
            const alertBox = document.createElement('div');
            alertBox.className = "bg-rose-500 text-white font-bold p-4 rounded-xl flex justify-between items-center shadow-lg animate-bounce";
            alertBox.innerHTML = `
                <span>🛎️ Alert: Table ${tableNum} requested [${serviceRequest}]!</span>
                <button onclick="this.parentElement.remove()" class="bg-white/20 hover:bg-white/30 text-white font-black px-3 py-1 rounded-lg text-xs">Dismiss</button>
            `;
            container.appendChild(alertBox);
            showBackgroundNotification(
                'Service Request',
                `Table ${tableNum} requested ${serviceRequest}.`
            );
        }

        function connectWS() {
            if (!kitchenToken) return;
            const WS_URL = `${window.location.protocol === "https:" ? "wss:" : "ws:"}//${window.location.host}/api/v1/kitchen/ws?token=${encodeURIComponent(kitchenToken)}`;
            const ws = new WebSocket(WS_URL);
            const statusIndicator = document.getElementById("ws-indicator");
            const statusLabel = document.getElementById("ws-status");

            ws.onopen = () => {
                statusIndicator.className = "h-2 w-2 rounded-full bg-emerald-500 animate-pulse";
                statusLabel.innerText = "Connected";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.event === "service_request") {
                    triggerStaffSummonAlert(data.table_number, data.request);
                } else if (data.event === "new_order") {
                    if (!orderMatchesStation(data.order || {})) {
                        return;
                    }
                    const tableNumber = data.order && data.order.table ? data.order.table.label : null;
                    playNewOrderChime(tableNumber);
                    fetchOrders();
                } else if (data.event === "status_update") {
                    if (!orderMatchesStation(data.order || {})) {
                        return;
                    }
                    fetchOrders();
                } else {
                    fetchOrders();
                }
            };

            ws.onclose = () => {
                statusIndicator.className = "h-2 w-2 rounded-full bg-red-500";
                statusLabel.innerText = "Offline (Reconnecting)";
                setTimeout(connectWS, 5000);
            };
        }

        async function bootKitchenPanel() {
            applyStationBranding();
            const configPromise = loadStationConfig();

            if (kitchenToken) {
                showLoginGate(false);
                if (audioUnlocked) {
                    markAudioActive();
                    warmKitchenAudio();
                }
                connectWS();
                await configPromise;
                fetchOrders();
            } else {
                await configPromise;
                showLoginGate(true);
            }
        }

        bootKitchenPanel();
    </script>
</body>
</html>
